name: marketing_performance_analytics
description: Email campaign performance and web conversion tracking

# ============================================================================
# PHYSICAL COLUMN REFERENCE (Use these EXACT names in SQL)
# ============================================================================
physical_columns:
  V_FACT_SFMC_SEND_PERFORMANCE_TRACKING:
    dimensions: [BUSINESSUNIT, SENDID, SENDID_COUNTRY_SK]
    time: [SENDDATE]
    facts: [SENDS, BOUNCES, OPENS, UNIQUEOPENS, CLICKS, UNIQUECLICKS, UNSUBSCRIBES]
  
  FACT_SFMC_CONVERSION_DIRECT_AGG:
    dimensions: [COUNTRY_CODE, CHANNEL_GROUPING, SOURCE, CAMPAIGN]
    time: [SESSION_DATE]
    facts: [SESSION_STARTED, PRODUCT_EVENTS, ORDER_ATTEMPT, SQL_LOAD, SQL_SUBMIT]

# ============================================================================
# VERIFIED QUERY EXAMPLES
# ============================================================================
verified_queries:
# Basic aggregations
- question: "Total emails sent"
  sql: SELECT SUM(SENDS) FROM V_FACT_SFMC_SEND_PERFORMANCE_TRACKING

- question: "Total emails sent last month"
  sql: |
    SELECT SUM(SENDS) FROM V_FACT_SFMC_SEND_PERFORMANCE_TRACKING
    WHERE SENDDATE >= DATEADD(month, -1, CURRENT_DATE())

# Rates by dimension
- question: "Open rates by market"
  sql: |
    SELECT BUSINESSUNIT, 
           (SUM(UNIQUEOPENS) / NULLIF(SUM(SENDS) - SUM(BOUNCES), 0)) * 100 as open_rate
    FROM V_FACT_SFMC_SEND_PERFORMANCE_TRACKING
    GROUP BY BUSINESSUNIT

- question: "Click rates by market"
  sql: |
    SELECT BUSINESSUNIT, 
           (SUM(UNIQUECLICKS) / NULLIF(SUM(SENDS) - SUM(BOUNCES), 0)) * 100 as click_rate
    FROM V_FACT_SFMC_SEND_PERFORMANCE_TRACKING
    GROUP BY BUSINESSUNIT

# Time-based filtering
- question: "Sends by market this week"
  sql: |
    SELECT BUSINESSUNIT, SUM(SENDS) as total_sends
    FROM V_FACT_SFMC_SEND_PERFORMANCE_TRACKING
    WHERE SENDDATE >= DATE_TRUNC('week', CURRENT_DATE())
    GROUP BY BUSINESSUNIT

- question: "Sends by market last month"
  sql: |
    SELECT BUSINESSUNIT, SUM(SENDS) as total_sends
    FROM V_FACT_SFMC_SEND_PERFORMANCE_TRACKING
    WHERE SENDDATE >= DATEADD(month, -1, CURRENT_DATE())
      AND SENDDATE < DATE_TRUNC('month', CURRENT_DATE())
    GROUP BY BUSINESSUNIT

# Specific market filtering
- question: "Open rate for VCUS"
  sql: |
    SELECT (SUM(UNIQUEOPENS) / NULLIF(SUM(SENDS) - SUM(BOUNCES), 0)) * 100 as open_rate
    FROM V_FACT_SFMC_SEND_PERFORMANCE_TRACKING
    WHERE BUSINESSUNIT = 'VCUS'

# Conversion queries
- question: "Conversion rate for VCUS this week"
  sql: |
    SELECT (SUM(ORDER_ATTEMPT) / NULLIF(SUM(SESSION_STARTED), 0)) * 100 as conversion_rate
    FROM FACT_SFMC_CONVERSION_DIRECT_AGG
    WHERE COUNTRY_CODE = 'VCUS'
      AND SESSION_DATE >= DATE_TRUNC('week', CURRENT_DATE())

- question: "Conversion rates by market"
  sql: |
    SELECT COUNTRY_CODE, 
           (SUM(ORDER_ATTEMPT) / NULLIF(SUM(SESSION_STARTED), 0)) * 100 as conversion_rate
    FROM FACT_SFMC_CONVERSION_DIRECT_AGG
    GROUP BY COUNTRY_CODE

# Complex nested queries
- question: "Average open rate across markets"
  sql: |
    SELECT AVG(market_open_rate) as avg_open_rate
    FROM (
      SELECT BUSINESSUNIT,
             (SUM(UNIQUEOPENS) / NULLIF(SUM(SENDS) - SUM(BOUNCES), 0)) * 100 as market_open_rate
      FROM V_FACT_SFMC_SEND_PERFORMANCE_TRACKING
      GROUP BY BUSINESSUNIT

# ============================================================================
# DETAILED TABLE DEFINITIONS
# ============================================================================
tables:
# Email Performance Table
- name: V_FACT_SFMC_SEND_PERFORMANCE_TRACKING
  description: Email send performance from Salesforce Marketing Cloud
  base_table:
    database: CAMPAIGN_ANALYTICS
    schema: GENERATED_DATA
    table: V_FACT_SFMC_SEND_PERFORMANCE_TRACKING
  
  dimensions:
    - name: market
      synonyms: ["country", "region", "business unit", "market name"]
      description: Market or business unit identifier
      expr: BUSINESSUNIT
      data_type: VARCHAR
      sample_values: ["VCUS", "VCUK", "VCDE", "VCFR", "VCIT"]
    - name: send_id
      description: Unique email send identifier
      expr: SENDID
      data_type: NUMBER
    - name: send_key
      description: Combined send and country identifier
      expr: SENDID_COUNTRY_SK
      data_type: VARCHAR
  
  time_dimensions:
    - name: send_date
      synonyms: ["email date", "campaign date", "send time"]
      description: Date when email was sent
      expr: SENDDATE
      data_type: DATE
  
  facts:
    # FIXED: Removed SUM() from expr, added default_aggregation
    - name: sends
      expr: SENDS                    # ✅ Physical column only
      data_type: NUMBER
      default_aggregation: sum
    - name: bounces
      expr: BOUNCES                  # ✅ Physical column only
      data_type: NUMBER
      default_aggregation: sum
    - name: opens
      expr: OPENS                    # ✅ Physical column only
      data_type: NUMBER
      default_aggregation: sum
    - name: unique_opens
      expr: UNIQUEOPENS              # ✅ Physical column only
      data_type: NUMBER
      default_aggregation: sum
    - name: clicks
      expr: CLICKS                   # ✅ Physical column only
      data_type: NUMBER
      default_aggregation: sum
    - name: unique_clicks
      expr: UNIQUECLICKS             # ✅ Physical column only
      data_type: NUMBER
      default_aggregation: sum
    - name: unsubscribes
      expr: UNSUBSCRIBES             # ✅ Physical column only
      data_type: NUMBER
      default_aggregation: sum
  
  metrics:
    # FIXED: Use physical column names (UPPERCASE)
    - name: delivery_rate
      description: Percentage of successfully delivered emails
      expr: ((SENDS - BOUNCES) / NULLIF(SENDS, 0)) * 100
      #       ^^^^^ UPPERCASE physical names
      data_type: NUMBER
      default_aggregation: avg
    - name: open_rate
      description: Percentage of delivered emails that were opened
      expr: (UNIQUEOPENS / NULLIF(SENDS - BOUNCES, 0)) * 100
      #      ^^^^^^^^^^ UPPERCASE
      data_type: NUMBER
      default_aggregation: avg
    - name: click_rate
      description: Click-through rate (clicks per delivered email)
      expr: (UNIQUECLICKS / NULLIF(SENDS - BOUNCES, 0)) * 100
      #      ^^^^^^^^^^^^ UPPERCASE
      data_type: NUMBER
      default_aggregation: avg
    - name: click_to_open_rate
      description: Percentage of openers who clicked
      expr: (UNIQUECLICKS / NULLIF(UNIQUEOPENS, 0)) * 100
      #      ^^^^^^^^^^^           ^^^^^^^^^^^ UPPERCASE
      data_type: NUMBER
      default_aggregation: avg
    - name: unsubscribe_rate
      description: Unsubscribe rate percentage
      expr: (UNSUBSCRIBES / NULLIF(SENDS - BOUNCES, 0)) * 100
      #      ^^^^^^^^^^^           ^^^^^ UPPERCASE
      data_type: NUMBER
      default_aggregation: avg

# Web Conversion Table
- name: FACT_SFMC_CONVERSION_DIRECT_AGG
  description: Website conversion funnel metrics and user behavior
  base_table:
    database: CAMPAIGN_ANALYTICS
    schema: GENERATED_DATA
    table: FACT_SFMC_CONVERSION_DIRECT_AGG
  
  dimensions:
    - name: market
      synonyms: ["country", "region", "country code"]
      description: Market identifier
      expr: COUNTRY_CODE
      data_type: VARCHAR
      sample_values: ["VCUS", "VCUK", "VCDE", "VCFR"]
    - name: channel
      synonyms: ["channel grouping", "traffic channel", "marketing channel"]
      description: Marketing channel category
      expr: CHANNEL_GROUPING
      data_type: VARCHAR
      sample_values: ["Email", "Direct", "Organic Search", "Paid Search"]
    - name: source
      synonyms: ["traffic source", "referrer"]
      description: Traffic source within channel
      expr: SOURCE
      data_type: VARCHAR
    - name: campaign
      synonyms: ["campaign name", "campaign identifier"]
      description: Campaign name
      expr: CAMPAIGN
      data_type: VARCHAR
  
  time_dimensions:
    - name: session_date
      synonyms: ["event date", "activity date", "visit date"]
      description: Date of user session
      expr: SESSION_DATE
      data_type: DATE
  
  facts:
    # FIXED: Physical columns only, no aggregations in expr
    - name: session_started
      expr: SESSION_STARTED          # ✅ Physical column only
      data_type: NUMBER
      default_aggregation: sum
    - name: product_events
      expr: PRODUCT_EVENTS           # ✅ Physical column only
      data_type: NUMBER
      default_aggregation: sum
    - name: financial_selection_review
      expr: FINANCIAL_SELECTION_REVIEW
      data_type: NUMBER
      default_aggregation: sum
    - name: sql_load
      expr: SQL_LOAD
      data_type: NUMBER
      default_aggregation: sum
    - name: sql_submit
      expr: SQL_SUBMIT
      data_type: NUMBER
      default_aggregation: sum
    - name: order_attempt_load
      expr: ORDER_ATTEMPT_LOAD
      data_type: NUMBER
      default_aggregation: sum
    - name: order_attempt_submit
      expr: ORDER_ATTEMPT_SUBMIT
      data_type: NUMBER
      default_aggregation: sum
    - name: order_attempt
      expr: ORDER_ATTEMPT            # ✅ Physical column only
      data_type: NUMBER
      default_aggregation: sum
    - name: test_drive_request
      expr: TEST_DRIVE_REQUEST
      data_type: NUMBER
      default_aggregation: sum
    - name: offer_request
      expr: OFFER_REQUEST
      data_type: NUMBER
      default_aggregation: sum
    - name: keep_me_updated
      expr: KEEP_ME_UPDATED
      data_type: NUMBER
      default_aggregation: sum
  
  metrics:
    # FIXED: Use physical column names
    - name: conversion_rate
      description: Session to order conversion percentage
      expr: (ORDER_ATTEMPT / NULLIF(SESSION_STARTED, 0)) * 100
      #      ^^^^^^^^^^^^          ^^^^^^^^^^^^^^ UPPERCASE physical names
      data_type: NUMBER
      default_aggregation: avg
    - name: product_engagement_rate
      description: Percentage of sessions with product views
      expr: (PRODUCT_EVENTS / NULLIF(SESSION_STARTED, 0)) * 100
      #      ^^^^^^^^^^^^^^         ^^^^^^^^^^^^^^ UPPERCASE
      data_type: NUMBER
      default_aggregation: avg