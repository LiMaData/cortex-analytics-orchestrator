name: marketing_performance_analytics
description: Email campaign performance and web conversion tracking

tables:
# Email Performance Table
- name: V_FACT_SFMC_SEND_PERFORMANCE_TRACKING
  description: Email send performance from Salesforce Marketing Cloud
  base_table:
    database: CAMPAIGN_ANALYTICS
    schema: GENERATED_DATA
    table: V_FACT_SFMC_SEND_PERFORMANCE_TRACKING
  
  dimensions:
    - name: market
      synonyms: ["country", "region", "business unit", "market name"]
      description: Market or business unit identifier
      expr: BUSINESSUNIT
      data_type: VARCHAR
      sample_values: ["VCUS", "VCUK", "VCDE", "VCFR", "VCIT"]
    - name: send_id
      description: Unique email send identifier
      expr: SENDID
      data_type: NUMBER
    - name: send_key
      description: Combined send and country identifier
      expr: SENDID_COUNTRY_SK
      data_type: VARCHAR
  
  time_dimensions:
    - name: send_date
      synonyms: ["email date", "campaign date", "send time"]
      description: Date when email was sent
      expr: SENDDATE
      data_type: DATE
  
  facts:
    - name: sends
      expr: SUM(SENDS)
      data_type: NUMBER
    - name: bounces
      expr: SUM(BOUNCES)
      data_type: NUMBER
    - name: opens
      expr: SUM(OPENS)
      data_type: NUMBER
    - name: unique_opens
      expr: SUM(UNIQUEOPENS)
      data_type: NUMBER
    - name: clicks
      expr: SUM(CLICKS)
      data_type: NUMBER
    - name: unique_clicks
      expr: SUM(UNIQUECLICKS)
      data_type: NUMBER
    - name: unsubscribes
      expr: SUM(UNSUBSCRIBES)
      data_type: NUMBER
  
  metrics:
    - name: delivery_rate
      description: Percentage of successfully delivered emails
      expr: ((sends - bounces) / NULLIF(sends, 0)) * 100
      data_type: NUMBER
      default_aggregation: avg
    - name: open_rate
      description: Percentage of delivered emails that were opened
      expr: (unique_opens / NULLIF(sends - bounces, 0)) * 100
      data_type: NUMBER
      default_aggregation: avg
    - name: click_rate
      description: Click-through rate (clicks per delivered email)
      expr: (unique_clicks / NULLIF(sends - bounces, 0)) * 100
      data_type: NUMBER
      default_aggregation: avg
    - name: click_to_open_rate
      description: Percentage of openers who clicked
      expr: (unique_clicks / NULLIF(unique_opens, 0)) * 100
      data_type: NUMBER
      default_aggregation: avg
    - name: unsubscribe_rate
      description: Unsubscribe rate percentage
      expr: (unsubscribes / NULLIF(sends - bounces, 0)) * 100
      data_type: NUMBER
      default_aggregation: avg

# Web Conversion Table
- name: FACT_SFMC_CONVERSION_DIRECT_AGG
  description: Website conversion funnel metrics and user behavior
  base_table:
    database: CAMPAIGN_ANALYTICS
    schema: GENERATED_DATA
    table: FACT_SFMC_CONVERSION_DIRECT_AGG
  
  dimensions:
    - name: market
      synonyms: ["country", "region", "country code"]
      description: Market identifier
      expr: COUNTRY_CODE
      data_type: VARCHAR
      sample_values: ["VCUS", "VCUK", "VCDE", "VCFR"]
    - name: channel
      synonyms: ["channel grouping", "traffic channel", "marketing channel"]
      description: Marketing channel category
      expr: CHANNEL_GROUPING
      data_type: VARCHAR
      sample_values: ["Email", "Direct", "Organic Search", "Paid Search"]
    - name: source
      synonyms: ["traffic source", "referrer"]
      description: Traffic source within channel
      expr: SOURCE
      data_type: VARCHAR
    - name: campaign
      synonyms: ["campaign name", "campaign identifier"]
      description: Campaign name
      expr: CAMPAIGN
      data_type: VARCHAR
  
  time_dimensions:
    - name: session_date
      synonyms: ["event date", "activity date", "visit date"]
      description: Date of user session
      expr: SESSION_DATE
      data_type: DATE
  
  facts:
    - name: session_started
      expr: SUM(SESSION_STARTED)
      data_type: NUMBER
    - name: product_events
      expr: SUM(PRODUCT_EVENTS)
      data_type: NUMBER
    - name: financial_selection_review
      expr: SUM(FINANCIAL_SELECTION_REVIEW)
      data_type: NUMBER
    - name: sql_load
      expr: SUM(SQL_LOAD)
      data_type: NUMBER
    - name: sql_submit
      expr: SUM(SQL_SUBMIT)
      data_type: NUMBER
    - name: order_attempt_load
      expr: SUM(ORDER_ATTEMPT_LOAD)
      data_type: NUMBER
    - name: order_attempt_submit
      expr: SUM(ORDER_ATTEMPT_SUBMIT)
      data_type: NUMBER
    - name: order_attempt
      expr: SUM(ORDER_ATTEMPT)
      data_type: NUMBER
    - name: test_drive_request
      expr: SUM(TEST_DRIVE_REQUEST)
      data_type: NUMBER
    - name: offer_request
      expr: SUM(OFFER_REQUEST)
      data_type: NUMBER
    - name: keep_me_updated
      expr: SUM(KEEP_ME_UPDATED)
      data_type: NUMBER
  
  metrics:
    - name: conversion_rate
      description: Session to order conversion percentage
      expr: (order_attempt / NULLIF(session_started, 0)) * 100
      data_type: NUMBER
      default_aggregation: avg
    - name: product_engagement_rate
      description: Percentage of sessions with product views
      expr: (product_events / NULLIF(session_started, 0)) * 100
      data_type: NUMBER
      default_aggregation: avg

# Sample verified queries for testing
verified_queries:
- question: "What was the total number of emails sent last week?"
  sql: |
    SELECT SUM(SENDS) as total_sends
    FROM V_FACT_SFMC_SEND_PERFORMANCE_TRACKING
    WHERE SENDDATE >= DATEADD('week', -1, CURRENT_DATE())
- question: "Show me email open rates by market for the past month"
  sql: |
    SELECT 
      BUSINESSUNIT as market,
      (SUM(UNIQUEOPENS) / NULLIF(SUM(SENDS - BOUNCES), 0)) * 100 as open_rate
    FROM V_FACT_SFMC_SEND_PERFORMANCE_TRACKING
    WHERE SENDDATE >= DATEADD('month', -1, CURRENT_DATE())
    GROUP BY BUSINESSUNIT
- question: "What's the conversion rate for VCUS this week?"
  sql: |
    SELECT 
      (SUM(ORDER_ATTEMPT) / NULLIF(SUM(SESSION_STARTED), 0)) * 100 as conversion_rate
    FROM FACT_SFMC_CONVERSION_DIRECT_AGG
    WHERE COUNTRY_CODE = 'VCUS'
      AND SESSION_DATE >= DATE_TRUNC('week', CURRENT_DATE())